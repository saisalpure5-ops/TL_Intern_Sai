<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Week 2 — Sanjivani Summer Internship 2026</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
/* ═══════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════ */
:root{
  /* Blues */
  --bg:        #050c1a;
  --bg2:       #071020;
  --surface:   #0a1628;
  --surface2:  #0d1c32;
  --surface3:  #10213a;
  --border:    rgba(100,160,255,.1);
  --border2:   rgba(100,160,255,.18);
  --border3:   rgba(100,160,255,.28);

  /* Accents */
  --blue:      #3b82f6;
  --blue2:     #60a5fa;
  --blue3:     #93c5fd;
  --cyan:      #22d3ee;
  --glow:      rgba(59,130,246,.15);
  --glow2:     rgba(59,130,246,.06);

  /* Text */
  --text:      #e2ecff;
  --text2:     #a8c0e8;
  --muted:     #5a7aaa;
  --muted2:    #3d5880;

  /* Status */
  --green:     #34d399;
  --gold:      #fbbf24;
  --rose:      #f87171;

  /* Fonts */
  --ff-head:   'Syne', sans-serif;
  --ff-body:   'Inter', sans-serif;
  --ff-mono:   'JetBrains Mono', monospace;

  /* Misc */
  --radius:    10px;
  --radius-lg: 16px;
}

/* ═══════════════════════════════════════
   RESET
═══════════════════════════════════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--ff-body);
  font-size:16px;
  line-height:1.75;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
img{max-width:100%;display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ═══════════════════════════════════════
   HERO / HEADER
═══════════════════════════════════════ */
.hero{
  position:relative;
  padding:90px 32px 80px;
  text-align:center;
  overflow:hidden;
  border-bottom:1px solid var(--border);
}

/* Grid */
.hero-grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(var(--border) 1px,transparent 1px),
    linear-gradient(90deg,var(--border) 1px,transparent 1px);
  background-size:52px 52px;
}

/* Top glow */
.hero::before{
  content:'';
  position:absolute;top:-120px;left:50%;transform:translateX(-50%);
  width:700px;height:500px;
  background:radial-gradient(ellipse,rgba(59,130,246,.18) 0%,transparent 65%);
  pointer-events:none;
}

.hero-inner{position:relative;z-index:1;max-width:740px;margin:0 auto}

/* Badge */
.hero-badge{
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.25);
  border-radius:100px;
  padding:7px 20px;
  font-size:11.5px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;
  color:var(--blue3);
  margin-bottom:32px;
  animation:fadeDown .7s cubic-bezier(.16,1,.3,1) both;
}
.live-dot{
  width:7px;height:7px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2.4s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* Headline */
.hero h1{
  font-family:var(--ff-head);
  font-size:clamp(2.2rem,5.5vw,3.8rem);
  font-weight:800;
  color:#fff;
  line-height:1.1;
  letter-spacing:-.025em;
  margin-bottom:16px;
  animation:fadeDown .7s .1s cubic-bezier(.16,1,.3,1) both;
}
.hero h1 span{
  background:linear-gradient(90deg,var(--blue2),var(--cyan));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
}

.hero-sub{
  font-size:16px;color:var(--text2);
  font-weight:400;margin-bottom:48px;
  animation:fadeDown .7s .18s cubic-bezier(.16,1,.3,1) both;
}

/* Meta strip */
.hero-meta{
  display:inline-flex;flex-wrap:wrap;justify-content:center;gap:0;
  border:1px solid var(--border2);
  border-radius:var(--radius);
  overflow:hidden;
  animation:fadeDown .7s .28s cubic-bezier(.16,1,.3,1) both;
}
.hm-cell{
  padding:13px 28px;
  border-right:1px solid var(--border2);
  text-align:center;
}
.hm-cell:last-child{border-right:none}
.hm-label{
  display:block;font-size:10px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:3px;
}
.hm-val{
  font-size:14px;font-weight:600;color:var(--text);
}

@keyframes fadeDown{
  from{opacity:0;transform:translateY(-14px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══════════════════════════════════════
   STICKY NAV
═══════════════════════════════════════ */
.day-nav{
  position:sticky;top:0;z-index:500;
  background:rgba(5,12,26,.94);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  display:flex;align-items:stretch;
  overflow-x:auto;scrollbar-width:none;
  transition:box-shadow .3s;
}
.day-nav.shadow{box-shadow:0 6px 32px rgba(0,0,0,.5)}
.day-nav::-webkit-scrollbar{display:none}

.nav-brand{
  flex-shrink:0;
  display:flex;align-items:center;
  padding:0 22px;
  border-right:1px solid var(--border2);
  font-family:var(--ff-head);
  font-size:13px;font-weight:700;
  color:var(--blue2);
  white-space:nowrap;
  letter-spacing:.02em;
}

.nav-tabs{display:flex;flex:1}

.day-tab{
  flex-shrink:0;
  height:50px;padding:0 20px;
  font-family:var(--ff-head);
  font-size:12px;font-weight:700;
  letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);
  position:relative;
  border-bottom:2px solid transparent;
  transition:color .2s,background .2s;
  white-space:nowrap;
}
.day-tab:hover{color:var(--text2);background:rgba(59,130,246,.05)}
.day-tab.active{color:var(--blue2);border-bottom-color:var(--blue)}

/* completed dot */
.day-tab.done::after{
  content:'';
  position:absolute;top:12px;right:10px;
  width:5px;height:5px;border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
}

.nav-counter{
  flex-shrink:0;
  display:flex;align-items:center;
  padding:0 20px;margin-left:auto;
  border-left:1px solid var(--border2);
  font-family:var(--ff-mono);
  font-size:11px;color:var(--muted);
  white-space:nowrap;
}

/* ═══════════════════════════════════════
   PAGE WRAPPER
═══════════════════════════════════════ */
.main{
  max-width:860px;
  margin:0 auto;
  padding:72px 28px 120px;
}

/* ═══════════════════════════════════════
   DAY PAGES
═══════════════════════════════════════ */
.day-page{display:none}
.day-page.active{
  display:block;
  animation:pageIn .5s cubic-bezier(.16,1,.3,1) both;
}
@keyframes pageIn{
  from{opacity:0;transform:translateY(22px)}
  to{opacity:1;transform:translateY(0)}
}

/* ═══════════════════════════════════════
   DAY HEADER
═══════════════════════════════════════ */
.day-header{
  display:flex;align-items:flex-start;gap:24px;
  padding:36px 40px;
  border-radius:var(--radius-lg);
  border:1px solid var(--border2);
  background:linear-gradient(135deg,var(--surface2),var(--surface));
  margin-bottom:64px;
  position:relative;
  overflow:hidden;
}
.day-header::before{
  content:'';
  position:absolute;top:-60px;right:-60px;
  width:220px;height:220px;
  border-radius:50%;
  background:radial-gradient(circle,var(--glow),transparent 70%);
  pointer-events:none;
}

.dh-badge{
  flex-shrink:0;
  width:68px;height:68px;
  border-radius:var(--radius);
  background:var(--blue);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:1px;
}
.dh-badge .db-word{
  font-size:8.5px;font-weight:700;
  letter-spacing:.15em;text-transform:uppercase;
  color:rgba(255,255,255,.7);
}
.dh-badge .db-num{
  font-family:var(--ff-head);
  font-size:1.9rem;font-weight:800;
  color:#fff;line-height:1;
}

.dh-text{}
.dh-eyebrow{
  font-size:11px;font-weight:600;
  letter-spacing:.1em;text-transform:uppercase;
  color:var(--muted);margin-bottom:8px;
}
.dh-title{
  font-family:var(--ff-head);
  font-size:clamp(1.4rem,3vw,2rem);
  font-weight:800;color:#fff;
  line-height:1.15;letter-spacing:-.02em;
  margin-bottom:14px;
}
.dh-tags{display:flex;flex-wrap:wrap;gap:8px}
.dh-tag{
  font-size:11.5px;font-weight:500;
  padding:4px 12px;
  border:1px solid var(--border2);
  border-radius:100px;
  color:var(--text2);
  background:rgba(59,130,246,.07);
}

/* ═══════════════════════════════════════
   TOPIC HEADER (e.g. "Topic 1 — VS Code")
═══════════════════════════════════════ */
.topic-header{
  display:flex;align-items:center;gap:0;
  margin-bottom:40px;
}
.topic-num{
  font-family:var(--ff-mono);
  font-size:12px;font-weight:500;
  color:var(--blue);
  background:rgba(59,130,246,.1);
  border:1px solid rgba(59,130,246,.2);
  border-radius:6px;
  padding:4px 10px;
  flex-shrink:0;
  margin-right:16px;
}
.topic-title{
  font-family:var(--ff-head);
  font-size:1.25rem;font-weight:700;
  color:#fff;letter-spacing:-.01em;
}
.topic-line{
  flex:1;height:1px;
  background:linear-gradient(90deg,var(--border2),transparent);
  margin-left:20px;
}

/* ═══════════════════════════════════════
   STEP — the core repeating unit
   Structure: step-label → para → img-block
   Repeat for each of 7-8 steps per topic
═══════════════════════════════════════ */
.step{
  margin-bottom:56px;
  padding-left:28px;
  border-left:1px solid var(--border2);
  position:relative;
}
/* Step number bubble on the left */
.step::before{
  content:attr(data-step);
  position:absolute;left:-14px;top:0;
  width:27px;height:27px;
  border-radius:50%;
  background:var(--surface3);
  border:1px solid var(--border3);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--ff-mono);
  font-size:10.5px;font-weight:500;
  color:var(--blue2);
  line-height:1;
  text-align:center;
  /* inline-flex via JS not needed — we use pseudo content trick */
}

.step-label{
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--ff-head);
  font-size:14px;font-weight:700;
  color:var(--blue2);
  letter-spacing:.02em;
  margin-bottom:14px;
}
.step-label .sl-icon{font-size:15px}

.step p{
  font-size:15.5px;
  color:var(--text2);
  line-height:1.85;
  margin-bottom:24px;
  font-weight:400;
}
.step p strong{color:var(--text);font-weight:600}
.step p em{color:var(--cyan);font-style:normal}
.step p code{
  font-family:var(--ff-mono);font-size:.82em;
  color:var(--gold);
  background:rgba(251,191,36,.07);
  border:1px solid rgba(251,191,36,.15);
  border-radius:4px;padding:1px 6px;
}

/* ═══════════════════════════════════════
   IMAGE BLOCK
═══════════════════════════════════════ */
.img-block{margin-bottom:10px}

.img-frame{
  border-radius:var(--radius-lg);
  overflow:hidden;
  border:1px solid var(--border2);
  background:var(--surface2);
  box-shadow:0 4px 24px rgba(0,0,0,.35);
  transition:transform .35s cubic-bezier(.16,1,.3,1),
             box-shadow .35s cubic-bezier(.16,1,.3,1);
}
.img-frame:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 48px rgba(0,0,0,.5),0 0 0 1px rgba(59,130,246,.2);
}

/* browser chrome bar */
.img-chrome{
  display:flex;align-items:center;gap:7px;
  padding:10px 14px;
  background:var(--surface3);
  border-bottom:1px solid var(--border);
}
.cd{width:11px;height:11px;border-radius:50%;flex-shrink:0}
.cd-r{background:#ff5f57}.cd-y{background:#febc2e}.cd-g{background:#28c840}
.chrome-addr{
  flex:1;margin:0 8px;
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:5px;padding:3px 10px;
  font-family:var(--ff-mono);font-size:10.5px;
  color:var(--muted);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}

.img-frame img{
  width:100%;display:block;
  min-height:160px;object-fit:cover;
  background:var(--surface2);
  transition:transform .4s cubic-bezier(.16,1,.3,1);
}
.img-frame:hover img{transform:scale(1.012)}

.img-caption{
  display:flex;align-items:center;gap:10px;
  margin-top:10px;margin-bottom:4px;
  font-family:var(--ff-mono);
  font-size:11.5px;color:var(--muted);
}
.cap-fig{
  color:var(--gold);font-weight:500;flex-shrink:0;
}

/* ═══════════════════════════════════════
   TOPIC SEPARATOR
═══════════════════════════════════════ */
.topic-sep{
  height:1px;
  background:linear-gradient(90deg,transparent,var(--border2),transparent);
  margin:64px 0;
}

/* ═══════════════════════════════════════
   CALLOUT
═══════════════════════════════════════ */
.callout{
  display:flex;gap:14px;
  border-radius:var(--radius);
  padding:16px 20px;
  margin:32px 0 56px;
}
.callout.info{
  background:rgba(59,130,246,.07);
  border:1px solid rgba(59,130,246,.2);
}
.callout.success{
  background:rgba(52,211,153,.06);
  border:1px solid rgba(52,211,153,.18);
}
.callout.warn{
  background:rgba(251,191,36,.05);
  border:1px solid rgba(251,191,36,.15);
}
.callout-icon{font-size:17px;flex-shrink:0;margin-top:1px}
.callout-body strong{
  display:block;font-size:11.5px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:var(--text);margin-bottom:4px;
}
.callout-body p{font-size:13.5px;color:var(--text2);line-height:1.7}
.callout-body p code{
  font-family:var(--ff-mono);font-size:.85em;color:var(--gold);
  background:rgba(251,191,36,.07);border:1px solid rgba(251,191,36,.15);
  border-radius:3px;padding:0 5px;
}

/* ═══════════════════════════════════════
   COMING SOON
═══════════════════════════════════════ */
.coming-soon{
  text-align:center;
  padding:100px 32px;
  border:1px dashed var(--border2);
  border-radius:var(--radius-lg);
  background:var(--surface);
}
.cs-icon{
  width:72px;height:72px;border-radius:50%;
  background:var(--surface3);
  border:1px solid var(--border2);
  display:flex;align-items:center;justify-content:center;
  font-size:1.8rem;margin:0 auto 20px;
}
.coming-soon h3{
  font-family:var(--ff-head);
  font-size:1.3rem;font-weight:700;
  color:var(--muted);margin-bottom:8px;
}
.coming-soon p{font-size:13.5px;color:var(--muted2)}

/* ═══════════════════════════════════════
   FOOTER
═══════════════════════════════════════ */
.site-footer{
  border-top:1px solid var(--border);
  padding:36px 32px;text-align:center;
  font-size:13px;color:var(--muted);
  line-height:2;
}
.site-footer strong{color:var(--text2)}

/* ═══════════════════════════════════════
   SCROLL REVEAL
═══════════════════════════════════════ */
.reveal{
  opacity:0;transform:translateY(20px);
  transition:opacity .6s cubic-bezier(.16,1,.3,1),
             transform .6s cubic-bezier(.16,1,.3,1);
}
.reveal.in{opacity:1;transform:none}
.rv1{transition-delay:.07s}
.rv2{transition-delay:.14s}
.rv3{transition-delay:.21s}

/* ═══════════════════════════════════════
   RESPONSIVE
═══════════════════════════════════════ */
@media(max-width:600px){
  .hero{padding:64px 18px 56px}
  .hero-meta{flex-direction:column;width:100%}
  .hm-cell{border-right:none;border-bottom:1px solid var(--border2)}
  .hm-cell:last-child{border-bottom:none}
  .main{padding:48px 16px 80px}
  .day-header{flex-direction:column;gap:16px;padding:24px 22px}
  .nav-counter,.nav-brand{display:none}
  .step{padding-left:20px}
  .topic-title{font-size:1.05rem}
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════
     HERO
═══════════════════════════════════════ -->
<header class="hero">
  <div class="hero-grid"></div>
  <div class="hero-inner">

    <div class="hero-badge">
      <span class="live-dot"></span>
      Sanjivani College of Engineering &nbsp;·&nbsp; Summer Internship 2026
    </div>

    <h1>Week 2 <span>Field Documentation</span></h1>

    <p class="hero-sub">
      A structured daily record of tools, steps &amp; learnings across seven internship sessions
    </p>

    <div class="hero-meta">
      <div class="hm-cell">
        <span class="hm-label">Intern</span>
        <span class="hm-val">TL_Intern_Sai</span>
      </div>
      <div class="hm-cell">
        <span class="hm-label">Duration</span>
        <span class="hm-val">4 Weeks</span>
      </div>
      <div class="hm-cell">
        <span class="hm-label">Focus</span>
        <span class="hm-val">Smart Prototyping</span>
      </div>
      <div class="hm-cell">
        <span class="hm-label">Status</span>
        <span class="hm-val" style="color:var(--green)">● Active</span>
      </div>
    </div>

  </div>
</header>

<!-- ═══════════════════════════════════════
     STICKY NAV
═══════════════════════════════════════ -->
<nav class="day-nav" id="dayNav">
  <div class="nav-brand">Week 1</div>
  <div class="nav-tabs">
    <button class="day-tab done active" onclick="showDay('day1',this)">Day 1</button>
    <button class="day-tab"            onclick="showDay('day2',this)">Day 2</button>
    <button class="day-tab"            onclick="showDay('day3',this)">Day 3</button>
    <button class="day-tab"            onclick="showDay('day4',this)">Day 4</button>
    <button class="day-tab"            onclick="showDay('day5',this)">Day 5</button>
    <button class="day-tab"            onclick="showDay('day6',this)">Day 6</button>
    <button class="day-tab"            onclick="showDay('day7',this)">Day 7</button>
  </div>
  <div class="nav-counter" id="navCounter">01 / 07</div>
</nav>
